services:
  app:
    image: node:latest
    user: "${UID}:${GID}"
    working_dir: /app
    network_mode: host
    volumes:
      - ./src:/app
      - ${AGY_BIN_PATH:-~/.local/bin/agy}:/usr/local/bin/agy:ro
      - ${AGY_CONFIG_PATH:-~/.gemini}:/home/node/.gemini
    command: sh -c "npm run dev -- --host --port 40638"
    environment:
      - NODE_ENV=development
